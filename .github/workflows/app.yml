name: Build APP
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish: If want ignore"
        required: false
      play:
        description: "Play: If want ignore"
        required: false

jobs:
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download libcore.aar from Release
        run: |
          gh release download libcore-latest --pattern "libcore.aar" --dir app/libs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Standalone sing-box binaries for root redir/tproxy (built by core.yml).
      # Placed under assets so runtime can extract by ABI without loading as JNI.
      - name: Download libsingbox.so binaries from Release
        run: |
          set -xeuo pipefail
          mkdir -p app/src/main/assets/singbox/arm64-v8a \
                   app/src/main/assets/singbox/armeabi-v7a \
                   app/src/main/assets/singbox/x86_64 \
                   app/src/main/assets/singbox/x86
          gh release download libcore-latest --pattern "libsingbox-*.so" --dir /tmp/singbox-so
          cp /tmp/singbox-so/libsingbox-arm64-v8a.so    app/src/main/assets/singbox/arm64-v8a/libsingbox.so
          cp /tmp/singbox-so/libsingbox-armeabi-v7a.so  app/src/main/assets/singbox/armeabi-v7a/libsingbox.so
          cp /tmp/singbox-so/libsingbox-x86_64.so       app/src/main/assets/singbox/x86_64/libsingbox.so
          cp /tmp/singbox-so/libsingbox-x86.so          app/src/main/assets/singbox/x86/libsingbox.so
          find app/src/main/assets/singbox -type f -ls
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}

  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'y'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts

      - name: Release
        run: |
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz
          tar -xvf ghr.tar.gz
          mv ghr*linux_amd64/ghr .
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          ./ghr -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" apks
